<div class="content">
    <app-sidebar></app-sidebar>
    <div class="user">
        <div class="username-div">
            <h1 class="username">{{ self()?.username || "not found" }}</h1>
            <button class="username-btn" (click)="toggleChNameScreen()">✎</button>
        </div>
        <div class="email-created-div">
            <label class="email">Connected to: {{ self()?.email || "not found" }}</label>
            <label class="email">Date created: {{ self()?.createdAt?.toString()?.slice(0,10) || "not found" }}</label>
        </div>
        <div class="score-div">
            <h1 class="score-title">YOUR SCORE</h1>
            <h1 class="score">{{ self()?.score || 0 }}</h1> 
        </div>
        <div class="btns">
            <button class="password-btn">Change password</button>
            <button class="delete-btn">Delete account</button>
        </div>
    </div>
</div>

@if (showChNameScreen()) {
    <div class="overlay" (click)="toggleChNameScreen()">
        <div class="overlay-div" (click)="$event.stopPropagation()">
            <input name="username" type="text" class="new-username" placeholder="New Username" [(ngModel)]="newUsername">
            @if (!validUsername() && newUsername().length > 0) {
                <label class="error-msg">Username must be at least 3 characters</label>
            } @else {
                <label class="fill"></label>
            }
            <div class="overlay-btns">
                <button class="cancel" [disabled]="loading()" (click)="toggleChNameScreen()">Cancel</button>
                <button class="confirm" [disabled]="!validUsername() || loading()" (click)="onChName()">Confirm</button>
            </div>
        </div>
    </div>
}
