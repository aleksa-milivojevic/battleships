<div class="background">
    <img class="background-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790616364/better-background_lhd8ib.png" alt="<background-image">
</div>
<div class="content">
    <form [formGroup]="form" (ngSubmit)="onSignin()">
        <div class="container">
            <input type="text" [placeholder]="('enter-email' | translate)" formControlName="email" required>

            <input type="text" [placeholder]="('enter-name' | translate)" formControlName="username" required>

            <input type="password" [placeholder]="('enter-pass' | translate)" formControlName="password" required>

            <input type="password" [placeholder]="('confirm-pass' | translate)" formControlName="password2" required>

            <div class="err-div">
                @if(errorMessage() !== "") {
                    <label class="err-msg">{{ errorMessage() | translate }}</label>
                }
            </div>
            
            <div class="btns">
                <button type="submit" [disabled]="form.invalid || isLoading()" class="submitbtn">{{ isLoading()? ('signing-in' | translate) : ('sign-in' | translate) }}</button>
                <button routerLink="/home" type="button" [disabled]="isLoading()" class="cancelbtn">{{ 'back' | translate }}</button>
            </div>
            <span class="psw">{{ 'has-acc' | translate }}<a routerLink="/login">{{ 'log-in' | translate }}</a>!</span>
        </div>
    </form>
</div>
