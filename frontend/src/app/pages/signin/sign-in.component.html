<div class="content">
    <form [formGroup]="form" (ngSubmit)="onSignin()">
        <div class="container">
            <input type="text" placeholder="Enter Email" formControlName="email" required>

            <input type="text" placeholder="Enter Username" formControlName="username" required>

            <input type="password" placeholder="Enter Password" formControlName="password" required>

            <input type="password" placeholder="Confirm Password" formControlName="password2" required>

            <div class="err-div">
                @if(errorMessage() !== "") {
                    <label class="err-msg">{{ errorMessage() }}</label>
                }
            </div>
            
            <div class="btns">
                <button type="submit" [disabled]="form.invalid || isLoading()" class="submitbtn">{{ isLoading()? 'Signing in' : 'Sign in' }}</button>
                <button routerLink="/home" type="button" [disabled]="isLoading()" class="cancelbtn">Back</button>
            </div>
            <span class="psw">Already have an account? <a routerLink="/login">Log in</a>!</span>
        </div>
    </form>
</div>
