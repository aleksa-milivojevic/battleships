<form [formGroup]="form" (ngSubmit)="onSignin()">
    <div class="container">
        <label for="email"><b>Email</b></label>
        <input type="text" placeholder="Enter Email" formControlName="email" required>

        <label for="username"><b>Username</b></label>
        <input type="text" placeholder="Enter Username" formControlName="username" required>

        <label for="password"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" formControlName="password" required>

        <label for="password2"><b>Confirm Password</b></label>
        <input type="password" placeholder="Confirm Password" formControlName="password2" required>

        @if(errorMessage() !== "") {
            <label class="err-msg">{{ errorMessage() }}</label>
        }
        
        <div class="btns">
            <button routerLink="/home" type="button" class="cancelbtn">Cancel</button>
            <button type="submit" class="submitbtn">Sign in</button>
        </div>
        <span class="psw"><a routerLink="/login">Already have an account?</a></span>
    </div>
</form>
