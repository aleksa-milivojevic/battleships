<div class="background">
    <img class="background-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790612970/home-background_y73iw9.png" alt="<backgound-img>">
</div>
<div class="content">
    @if (banned()) {
        <div class="ban-div">
            <label class="restriction">
                {{ 'ban-text' | translate }}
            </label>
        </div>
    }
    @else if (timeout()) {
        <div class="timeout-div">
            <label class="restriction">
                {{ ('timeout-text' | translate) + expiration().getDate() + '.' + expiration().getMonth() + '.' + expiration().getFullYear() + ". " + expiration().getHours() + ':' + expiration().getMinutes()}}.
            </label>
        </div>
    }
    <img class="title" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790612979/title_z58crw.png" alt="<title>">
    <div class="btn-div">
        <button routerLink="/login" class="login">{{ 'log-in' | translate }}</button>
        <button routerLink="/signin" class="signin">{{ 'sign-in' | translate }}</button>
    </div>
</div>
