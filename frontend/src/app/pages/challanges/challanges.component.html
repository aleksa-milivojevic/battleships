<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="desc-div">
            <label class="desc">{{ "challanges" | translate }}</label>
        </div>
        <div class="invite-list">
            @if (invites().length > 0) {
            @for(invite of invites(); track invite.id) {
                <div class="invite">
                    <div class="user">
                        <div class="username-pfp">
                            <img class="pfp" [src]="invite.picture" alt="pfp"/>
                            <label class="username">{{ invite.username }}</label>
                            <label class="user-score">{{ invite.score }}</label>
                            <img class="trophy" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950377/trophy_mxczir.png" alt="<trophy>">
                        </div>
                    </div>
                    <button class="accept" (click)="acceptInvite(invite.id)">{{ 'accept' | translate }}</button>
                </div>
            }
            }
            @else {
                <label class="no-invites">{{ 'challanges-info' | translate }}</label>
            }
        </div>
    </div>
</div>
<app-footer></app-footer>
