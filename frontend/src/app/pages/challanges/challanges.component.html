<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="invite-list">
            @for(invite of invites(); track invite.id) {
                <div class="invite">
                    <div class="user">
                        <div class="username-pfp">
                            <label class="username">{{ invite.username }}</label>
                        </div>
                        <label class="user-score">{{ invite.score }}</label>
                    </div>
                    <button class="accept" (click)="acceptInvite(invite.id)">Accept</button>
                </div>
            }
        </div>
    </div>
</div>
