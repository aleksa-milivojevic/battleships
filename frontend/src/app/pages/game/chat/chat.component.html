<div class="main">
    <div class="opp-div">
        <div class="pts-div">
            <label class="pts">Points for this match: +/- 150</label>
        </div>
        <div class="username-div">
            <img class="pfp" [src]="opp()?.picture" alt="<pfp>">
            <div class="opp-info">
                <label class="opp-username">{{ opp()?.username || 'unknown' }}</label>
                <label class="opp-score">{{ opp()?.score }}</label>
            </div>
        </div>
        <div class="dropdown">
            <button class="report-btn" (click)="toggleReportOptions()">report</button>
            <div class="report-div" [class.hidden]="!showReportOptions()">
                <label class="report-option" [class.disabled]="cheatReported()" (click)="onReport()">cheating</label>
                <label class="report-option" [class.disabled]="msgReported()" (click)="onReport('messages')">vulgar chat</label>
            </div>
        </div>
        
        <div class="chat-div">
            @for (msg of messages(); track $index) {
                @if ($index === 0 || messages()[$index - 1].author !== msg.author) {
                    <label [ngClass]="(msg.author) ? 'opp-author' : 'me-author'">{{ (msg.author) ? opp()?.username : self()?.username }}</label>
                }
                <label [ngClass]="(msg.author) ? 'opp-msg' : 'my-msg'">{{ msg.text }}</label>
            }
        </div>
        <div class="input-div">
            <input type="text" name="message" placeholder="write a message..." [ngModel]="message()" (ngModelChange)="message.set($event)">
            <img class="send-btn"(click)="sendMessage()" [class.disabled]="message() === ''" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790712682/send_ejv3u5.png" alt="<send>">
        </div>
    </div>
</div>
