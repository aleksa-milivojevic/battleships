<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="list-div">
            <div class="selector-div">
                <div class="reported-div" [class.selected]="!reportedOrRestricted()" (click)="reportedOrRestricted.set(false)">
                    <label>reported</label>
                </div>
                <div class="restricted-div" [class.selected]="reportedOrRestricted()" (click)="reportedOrRestricted.set(true)">
                    <label>restricted</label>
                </div>
            </div>
            <div class="user-list" (scroll)="onScroll($event)">
                @if (!reportedOrRestricted()) {
                    @for(el of reportedUsers(); track el.user.id) {
                        <div class="user" (click)="selectUser(el)">
                            <div class="username-score">
                                <div class="username-div">
                                    <label class="username">{{ el.user.username }}</label>
                                </div>
                                <label class="score">{{ el.user.score }}</label>
                            </div>
                        </div>
                    }
                }
                @else {
                    @for(el of restrictedUsers(); track el.id) {
                        <div class="user">
                            <div class="username-score">
                                <div class="username-div">
                                    <label class="username">{{ el.username }}</label>
                                </div>
                                <label class="score">{{ el.score }}</label>
                            </div>
                            <div class="restriction-type-div">
                                <label class="restriction-type">{{ (el.banned) ? 'PERMANENTLY BANNED' : `TIMED OUT UNTIL ${parsedDate(el)}` }}</label>
                            </div>
                            <div class="unrestrict-div">
                                <button class="unrestrinct-btn" (click)="onUnrestrict(el.id)">unrestrict</button>
                            </div>
                        </div>
                    }
                }
            </div>
        </div>
        <div class="list-div">
            <div class="selected-user">
                <div class="user-info">
                    <div class="username-div">
                        <label class="selected-username">{{ selectedUser()?.username }}</label>
                    </div>
                    <label class="score">{{ selectedUser()?.score }}</label>
                </div>
                <div class="restriction-btns">
                    <button class="ban-btn" [disabled]="selectedUser()?.banned || selectedUser()?.timeout" (click)="onBan(selectedUser()?.id!)">ban</button>
                    <div class="timeout-div">
                        <input
                            type="number"
                            class="duration"
                            name="duration"
                            [ngModel]="duration()"
                            (ngModelChange)="duration.set($event)"
                        >
                        <button class="timeout-btn" [disabled]="selectedUser()?.banned || selectedUser()?.timeout" (click)="onTimeout(selectedUser()?.id!, duration())">timeout</button>
                    </div>
                </div>
            </div>
            <div class="report-list">
                @for(el of reportList(); track el.id) {
                    <div class="report">
                        <div class="report-info">
                            <label class="type">{{ el.type }}</label>
                            <label class="source">{{ el.source?.username }}</label>
                            @if (el.type === 'messages') {
                                <button class="messages-btn" [disabled]="el.type !== 'messages'" (click)="toggleReportMessages(el.id); selectReport(el.id)">...</button>
                            }
                        </div>
                        @if (selectedReport() === el.id && showReportMessages()) {
                            <div class="msgs-div">
                                <label class="msgs">{{ el.messages }}</label>
                            </div>
                        }
                    </div>
                }
            </div>
        </div>
    </div>
</div>
