<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="user-list" (scroll)="onScrollUsers($event)">
            @for(user of users(); track user.id) {
                <div class="user">
                    <div class="username-score">
                        <div class="username-div">
                            <label class="username">{{ user.username }}</label>
                        </div>
                        <label class="score">{{ user.score }}</label>
                    </div>
                    <button class="btn" (click)="onBan(user.id)">ban</button>
                </div>
            }
        </div>
    </div>
</div>
