<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="list-container" (scroll)="onScroll($event)">
            @for(user of users(); track $index) {
                <div class="user">
                    <label class="rank" [ngClass]="{ 'rank-1': $index === 0, 'rank-2': $index === 1, 'rank-3': $index === 2 }" >{{ $index + 1 }}</label>
                    <label class="username">{{ user.username }}</label>
                    @if(user.online) {
                        <label class="online" style="color: greenyellow;">o</label>
                    }
                    <label class="score">{{ user.score }}</label>
                </div>
            }
        </div>
    </div>
</div>
