<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="list-container" (scroll)="onScroll($event)">
            @for(user of users(); track $index) {
                <div class="user">
                    @if ($index === 0) {
                        <img class="rank-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950384/first_js3avq.png" alt="<first>">
                    }
                    @else if ($index === 1) {
                        <img class="rank-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950391/second_c9tiax.png" alt="<second>">
                    }
                    @else if ($index === 2) {
                        <img class="rank-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950400/third_wof7xh.png" alt="<third>">
                    }
                    @else {
                        <label class="rank">{{ '#' + ($index + 1) }}</label>
                    }
                    <img class="pfp" [class.online]="user.online" [src]="user.picture" alt="PFP"/>
                    <label class="username">{{ user.username }}</label>
                    <label class="score">{{ user.score }}</label>
                    <img class="trophy" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950377/trophy_mxczir.png" alt="<trophy>">
                </div>
            }
        </div>
    </div>
</div>
