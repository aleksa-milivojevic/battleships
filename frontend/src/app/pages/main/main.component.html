<div class="content">
    <app-sidebar></app-sidebar>
    <div class="container">
        <div class="bot">
            <label class="bot-title">Bot</label>
            <label class="bot-desc">Play against a computer</label>
        </div>
        <div class="pvp" (click)="onPvP()">
            <label class="pvp-title">PvP</label>
            <label class="bot-desc">Play against a random person</label>
        </div>
        <div class="challange" (click)="toggleOverlay()">
            <label class="challange-title">Challange a friend!</label>
            <label class="bot-desc">If they are online, challange them to a battle</label>
        </div>
    </div>
    <div class="container">
        <div class="match-list" (scroll)="onScrollMatches($event)">
            @for(match of matches(); track match.id) {
                <div class="match">
                    @if(match.winner?.id === self()?.id) {
                        <div class="result-div">
                                <label class="result">WIN</label>
                                <label class="points">+{{ match.points }}</label>
                        </div>
                        <div class="opp-div">
                            <label class="vs">vs </label>
                            <label class="opp">{{ match.looser?.username ??  "deleted" }}</label>
                        </div>
                    } @else {
                        <div class="result-div">
                            <label class="result">LOSS</label>
                            <label class="points">-{{ match.points }}</label>
                        </div>
                        <div class="opp-div">
                            <label class="vs">vs </label>
                            <label class="opp">{{ match.winner?.username ?? "deleted" }}</label>
                        </div>    
                    }
                </div>
            }
        </div>
    </div>
</div>

@if (overlay()) {
    <div class="overlay" (click)="toggleOverlay()">
        <div class="search-div" (click)="$event.stopPropagation()">
            <form>
                <input
                    name="search"
                    [ngModel]="search()"
                    (ngModelChange)="search.set($event)"
                    class="search"
                    placeholder="username"
                >
            </form>
            <div class="user-list" (scroll)="onScrollUsers($event)">
                @for(user of users(); track user.id) {
                    <div class="user">
                        <div class="username-score">
                            <div class="username-div">
                                <label class="username">{{ user.username }}</label>
                                @if(user.online) {
                                    <label class="online" style="color: greenyellow;">o</label>
                                }
                            </div>
                            <label class="score">{{ user.score }}</label>
                        </div>
                        <button class="challange-btn" [disabled]="!user.online" (click)="onChall(user.id)">chall</button>
                    </div>
                }
            </div>
        </div>
    </div>
}

@if(showQueueScreen()) {
    <div class="overlay" (click)="toggleQueue()">
        <div class="queue-div" (click)="$event.stopPropagation()">
            <h1 class="queue-title">Waiting for a match...</h1>
        </div>
    </div>
}
