<div class="sidebar">
    <div class="top-options">
        <div class="option button-sfx" routerLink="/main">
            <div class="img-div">
                <img class="option-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950447/challange_tlzrss.png" alt="<option>">
            </div>
            <label class="option-name">{{ 'battle' | translate }}</label>
        </div>
        <div class="option button-sfx" routerLink="/challanges">
            <div class="img-div">
                <img class="option-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1791102873/challanges_dnogbo.png" alt="<option>">
            </div>
            <label class="option-name">{{ 'challanges' | translate }}</label>
        </div>
        <div class="option button-sfx" routerLink="/leaderboard">
            <div class="img-div">
                <img class="option-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950443/leaderboard_bbod4w.png" alt="<option>">
            </div>
            <label class="option-name">{{ 'leaderboard' | translate }}</label>
        </div>
        @if (self()?.admin) {
            <div class="option button-sfx" routerLink="/restrictions">
                <div class="img-div">
                    <img class="option-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950657/restrictions_smj9gc.png" alt="<option>">
                </div>
                <label class="option-name">{{ 'restrictions' | translate }}</label>
            </div>
        }
        @else {
            <div class="fill"></div>
        }
    </div>
    <div class="bottom-options">
        <div class="option button-sfx" (click)="toggleSettings()">
            <div class="img-div">
                <img class="option-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950427/settings_sipset.png" alt="<option>">
            </div>    
            <label class="option-name">{{ 'settings' | translate }}</label>
        </div>
        <div class="option button-sfx" routerLink="/profile">
            <div class="img-div">
                <img class="option-img" [class.profile]="true" [src]="self()?.picture" alt="<option>">
            </div>
            <label class="option-name">{{ 'my-profile' | translate }}</label>
        </div>
        <div class="option button-sfx"  (click)="onLogout()">
            <div class="img-div">
                <img class="option-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1790950431/logout_qwlzhs.png" alt="<option>">
            </div>
            <label class="option-name">{{ 'logout' | translate }}</label>
        </div>
    </div>
</div>

@if (showSettings()) {
    <div class="overlay" (click)="toggleSettings()">
        <div class="settings-div" (click)="$event.stopPropagation()">
            <div class="settings-option" (click)="toggleLanguage(); playButtonSFX()">
                <img class="settings-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1793092808/2026_10_27_0gr_Kleki_gunid4.png" alt="<lang>">
                <label>SR/EN</label>
            </div>
            <div class="settings-option" (click)="toggleMusic(); playButtonSFX()">
                @if (!muted()) {
                    <img class="settings-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1793092914/2026_10_27_0h9_Kleki_by1xlz.png" alt="<music>">
                }
                @else {
                    <img class="settings-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1793092820/2026_10_27_0gw_Kleki_izlgg4.png" alt="<music>">
                }
                <label>Music</label>
            </div>
            <div class="settings-option" (click)=" playButtonSFX(); toggleSFX()">
                @if (sfx()) {
                    <img class="settings-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1793092824/2026_10_27_0h0_Kleki_wsvbdq.png" alt="<sfx>">
                }
                @else {
                    <img class="settings-img" src="https://res.cloudinary.com/drjisyvve/image/upload/v1793092828/2026_10_27_0gz_Kleki_poaocq.png" alt="<sfx>">
                }
                <label>SFX</label>
            </div>
        </div>
    </div>
}
